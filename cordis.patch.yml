# Mounts the thin messaging/guidance increment as one Host row.
#
# It replaces nothing structural: the shipped `agent-team` / `tool-agent-team`
# rows own the team model (named, multi-level subagents; task board; wait_agent;
# interrupt_agent). This plugin only shadows `send_message` per Agent where the
# composition already declares one, and adds a single prompt context.
- insert:
    - id: lineage-teams
      name: '@y916/dsh-lineage-teams'

# Mounts the forked Agent Teams DOMAIN (service + journal) as the one Host singleton.
# The model-facing tools are a separate plugin — `@y916/dsh-lineage-teams/tools` —
# that each Agent Preset mounts explicitly, the same opt-in shape as the built-in
# delegation rows. A preset without that row gets no Team tools and no Team prompt.
- insert:
    - id: lineage-agent-team
      name: '@y916/dsh-lineage-teams'
      config:
        maxMembers: 16
        maxTasks: 256
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000
